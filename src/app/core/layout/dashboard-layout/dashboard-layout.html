<app-district-modal></app-district-modal>

<div class="stage w-full h-full relative">



    <div class="content-grid w-full h-full relative z-10 xl:pl-20" [class.is-sk-mode]="mapState.activeTab() === 'sk'" [class.parliament-quota]="mapState.activeTab() === 'sk' && mapState.councilView() === 'quota'">
        <article class="area-map flex flex-col min-h-0 relative">
            <!-- Logo + Toggle: always visible over map area -->
            <div class="map-logo-toggle absolute top-0 z-50" style="pointer-events:none;">
                    <div class="flex flex-col gap-3">
                    <!-- Logo -->
                    <div class="logo-brand">
                        <img src="/LOGO_ELECTION_BKK.png" alt="วันเลือกตั้งผู้ว่าฯ กทม. 69" class="election-logo">
                    </div>
                    <!-- Main toggle -->
                    <div class="toggle-pill" style="pointer-events:auto;">
                        <button (click)="mapState.activeTab.set('summary')"
                            class="toggle-btn"
                            [class.toggle-btn-active]="mapState.activeTab() === 'summary'">
                            ผลรวม
                        </button>
                        <button (click)="mapState.activeTab.set('sk')"
                            class="toggle-btn"
                            [class.toggle-btn-active]="mapState.activeTab() === 'sk'">
                            ผลการเลือก ส.ก.
                        </button>
                    </div>
                    <!-- Secondary toggle: only in ส.ก. mode -->
                    @if (mapState.activeTab() === 'sk') {
                    <div class="toggle-pill toggle-pill-sm" style="pointer-events:auto;">
                        <button (click)="mapState.councilView.set('quota')"
                            class="toggle-btn toggle-btn-sm"
                            [class.toggle-btn-active]="mapState.councilView() === 'quota'">
                            ผลตามที่นั่ง
                        </button>
                        <button (click)="mapState.councilView.set('district')"
                            class="toggle-btn toggle-btn-sm"
                            [class.toggle-btn-active]="mapState.councilView() === 'district'">
                            ผลรายเขต
                        </button>
                    </div>
                    }
                </div>
            </div>
            <main class="flex-1 min-h-0 w-full" style="container-type:size;">
                <app-parliament-chart
                    class="block w-full h-full"
                    [style.display]="(mapState.activeTab() === 'sk' && mapState.councilView() === 'quota') ? 'block' : 'none'">
                </app-parliament-chart>
                <app-map-viewer
                    class="block w-full h-full"
                    [style.display]="!(mapState.activeTab() === 'sk' && mapState.councilView() === 'quota') ? 'block' : 'none'">
                </app-map-viewer>
            </main>
        </article>

        <app-navbar class="area-search block w-full"></app-navbar>

        @if (mapState.activeTab() === 'summary') {
        <app-hero-card class="panel-glass area-hero flex flex-col"></app-hero-card>
        }

        <section class="panel-glass area-candidates flex flex-col overflow-hidden min-h-0">
            <header
                class="px-5 py-4 border-b flex items-center justify-between flex-shrink-0">
                <div class="flex flex-col">
                    <span class="font-black text-sm text-slate-800 tracking-tight">
                        {{ mapState.activeTab() === 'summary' ? 'ลำดับคะแนน Real-time' : 'ผลการเลือก ส.ก.' }}
                    </span>
                </div>
                <div class="flex items-center gap-3">
                    <!-- Share button -->
                    <button (click)="shareUrl()"
                        class="flex items-center gap-1 text-[16px] font-black text-teal-600/50 uppercase tracking-widest hover:text-teal-700 transition-colors duration-200"
                        [title]="mapState.selectedDistrictId() ? 'แชร์ลิงก์เขต ' + mapState.selectedDistrictId() : 'แชร์ลิงก์'">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                        </svg>
                        แชร์
                    </button>
                    <span class="relative flex h-2 w-2">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
                    </span>
                    <span class="text-rose-600 text-[16px] font-black tracking-widest uppercase">Live</span>
                </div>
            </header>
            <div class="flex-1 overflow-y-auto min-h-0 custom-scrollbar">
                <app-policy-list
                    class="block w-full"
                    [style.display]="mapState.activeTab() === 'summary' ? 'block' : 'none'">
                </app-policy-list>
                <app-council-result
                    class="block h-full"
                    [style.display]="mapState.activeTab() !== 'summary' ? 'block' : 'none'">
                </app-council-result>
            </div>
        </section>



    </div>

    @if (copyToast()) {
    <div class="copy-toast">✓ คัดลอกลิงก์แล้ว</div>
    }
</div>
