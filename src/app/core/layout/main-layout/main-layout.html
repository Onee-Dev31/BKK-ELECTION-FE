<div class="h-dvh w-screen overflow-hidden relative text-white">

  <!-- Bangkok skyline bg — full viewport -->
  <div class="bkk-skyline-layer" aria-hidden="true"></div>

  <div class="absolute inset-0 z-10 xl:pl-20 overflow-hidden">
      <router-outlet></router-outlet>
  </div>

  <!-- Desktop sidebar -->
  <div class="absolute left-4 top-0 z-50 h-full w-fit hidden xl:flex flex-col justify-center" style="z-index:60">
      <app-sidebar class="block w-fit h-fit"></app-sidebar>
  </div>

  <!-- Mobile/tablet bottom navigation -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 flex xl:hidden items-center justify-around
              px-2 py-2 backdrop-blur-2xl safe-bottom theme-bottom-nav">
    @for (item of navItems; track item.id) {
      <button (click)="navigate(item.path)"
              class="flex flex-col items-center gap-1 px-4 py-2 rounded-2xl transition-all duration-300 theme-nav-btn"
              [class.active]="isActive(item.path)">

        @if (item.id === 'map') {
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
              d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
          </svg>
        }
        @if (item.id === 'compare') {
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
        }
        @if (item.id === 'top5') {
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
              d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
          </svg>
        }

        <span class="text-[16px] font-bold tracking-wide">{{ item.label }}</span>

        @if (isActive(item.path)) {
          <span class="w-1 h-1 rounded-full theme-active-dot"></span>
        }
      </button>
    }

    <!-- Theme toggle in bottom nav -->
    <button (click)="theme.toggle()"
            class="flex flex-col items-center gap-1 px-3 py-2 rounded-2xl transition-all duration-300 theme-nav-btn">
      @if (theme.isDark()) {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      } @else {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      }
      <span class="text-[16px] font-bold tracking-wide">{{ theme.isDark() ? 'Light' : 'Dark' }}</span>
    </button>
  </nav>
</div>
