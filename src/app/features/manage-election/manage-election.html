<div class="page">
  <div class="tabs">
    <div class="tab-buttons">
      <button class="tab-btn" [class.active]="activeTab === 1" (click)="activeTab = 1">
        Generate JSON
      </button>

      <button class="tab-btn" [class.active]="activeTab === 2" (click)="activeTab = 2">
        Upload JSON
      </button>
    </div>

    <button class="btn btn-logout" (click)="logout()">
      <svg class="logout-icon" viewBox="0 0 24 24" fill="none">
        <path
          d="M21 12L13 12"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M18 15L20.913 12.087C20.961 12.039 20.961 11.961 20.913 11.913L18 9"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M16 5V4.5C16 3.67157 15.3284 3 14.5 3H5C3.89543 3 3 3.89543 3 5V19C3 20.1046 3.89543 21 5 21H14.5C15.3284 21 16 20.3284 16 19.5V19"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      Logout
    </button>
  </div>

  @if (activeTab === 1) {
    <div class="container">
      <!-- LEFT -->
      <div class="left-panel">
        <div class="top-action">
          <div class="auto-refresh-group">
            <span>Auto Refresh</span>

            <input
              type="number"
              min="1"
              [(ngModel)]="refreshSeconds"
              (change)="onRefreshSecondsChange()"
              class="refresh-input"
            />

            <span>sec</span>

            <label class="switch">
              <input
                type="checkbox"
                [(ngModel)]="autoRefreshEnabled"
                (change)="toggleAutoRefresh()"
              />
              <span class="slider"></span>
            </label>
          </div>

          <!-- <button class="btn btn-secondary" (click)="refresh()">Refresh</button> -->
        </div>

        <hr class="divider" />

        <div class="section-header">
          <h2>อัปเดตข้อมูลผู้สมัคร</h2>

          <div class="counted-group">
            <label>นับแล้ว (%)</label>

            <input
              type="number"
              [(ngModel)]="countedPercentage"
              placeholder=""
              class="counted-input"
            />
          </div>
        </div>

        <form [formGroup]="form">
          <table class="candidate-table">
            <thead>
              <tr>
                <th>ลำดับ</th>
                <th>ชื่อผู้สมัคร</th>
                <th>รูปผู้สมัคร</th>
                <th>พรรค</th>
                <th>รูปพรรค</th>
                <th>คะแนน</th>
              </tr>
            </thead>

            <tbody formArrayName="candidates">
              @for (candidate of candidates.controls; track $index) {
                <tr [formGroupName]="$index">
                  <td>{{ $index + 1 }}</td>

                  <td>
                    <input type="text" formControlName="name" />
                  </td>

                  <td>
                    <input type="text" formControlName="imageUrl" />
                  </td>

                  <td>
                    <input type="text" formControlName="partyName" />
                  </td>

                  <td>
                    <input type="text" formControlName="partyLogoUrl" />
                  </td>

                  <td>
                    <input type="number" formControlName="votes" />
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </form>

        <div class="action-bar">
          <button class="btn btn-primary" (click)="submit()">GEN JSON</button>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="right-panel">
        <pre>{{ jsonPreview }}</pre>
      </div>
    </div>
  }

  @if (activeTab === 2) {
    <div class="upload-tab">
      <h2>Upload JSON</h2>

      <textarea rows="20" placeholder="Paste JSON here..."> </textarea>

      <button class="btn btn-primary">Upload</button>
    </div>
  }
</div>
