<div class="parliament-wrap" (click)="selectedSeat.set(null)">

  <div class="svg-wrap" #svgWrap>
    <svg viewBox="0 0 800 400" class="parliament-svg" #svgEl>
      @for (dot of dots(); track $index) {
        <polygon
          [attr.points]="hexPoints(dot.x, dot.y, 22)"
          [attr.fill]="dot.color"
          [attr.opacity]="selectedSeat() && selectedSeat()?.dot?.districtId !== dot.districtId ? 0.3 : 0.92"
          [class.seat-dot]="true"
          [class.seat-selected]="selectedSeat()?.dot?.districtId === dot.districtId"
          (click)="$event.stopPropagation(); selectSeat(dot)"
          [style.cursor]="dot.candidate ? 'pointer' : 'default'"
          [style.animation-delay]="$index * 18 + 'ms'">
          <title>{{ dot.candidate ? dot.candidate.fullName + ' — เขต ' + dot.districtId : '' }}</title>
        </polygon>
      }
    </svg>

    @if (seatCardData(); as card) {
      <app-seat-popup-card [data]="card" (close)="selectedSeat.set(null)"></app-seat-popup-card>
    }
  </div>

  <div class="chart-footer">
    <div class="chart-title">
      <span class="chart-label">ผลการเลือก ส.ก.</span>
      <span class="chart-sub">สมาชิกสภากรุงเทพมหานคร <strong>50</strong> ที่นั่ง</span>
    </div>

    <div class="seat-bar">
      @for (p of partyResults(); track p.party.partyId) {
        @if (p.seats > 0) {
          <div class="seat-bar-segment"
               [style.flex]="p.seats"
               [style.backgroundColor]="p.party.color"
               [title]="p.party.partyName + ' ' + p.seats + ' ที่นั่ง'">
          </div>
        }
      }
    </div>

    <app-party-legend [parties]="partyResults()"></app-party-legend>
  </div>

</div>
