<div #scrollEl class="compare-page" (scroll)="onScroll(scrollEl)">

  <!-- Page header (mobile only) -->
  <div class="page-header-mobile">
    <h1 class="page-title-mobile">เปรียบเทียบผู้สมัคร</h1>
    <div class="page-subtitle-mobile">Compare Candidates</div>
  </div>

  <div class="compare-grid">

    <!-- Left candidate panel -->
    <app-cand-panel
      class="cand-a"
      [info]="candidateAInfo()"
      [candidates]="sortedCandidates()"
      [selectedId]="selectedIdA()"
      (selectedIdChange)="selectedIdA.set($event)">
    </app-cand-panel>

    <!-- Center panel -->
    <div class="center-panel">

      <!-- Desktop header -->
      <div class="page-header-desktop">
        <h1 class="page-title-desktop">เปรียบเทียบผู้สมัคร</h1>
        <div class="page-subtitle-desktop">Compare Candidates</div>
      </div>

      <!-- Vote difference bar -->
      @if (voteDiff()) {
        <div class="glass-card vote-diff-card">
          <app-vote-bar
            [voteDiff]="voteDiff()"
            [candidateA]="candidateA()"
            [candidateB]="candidateB()">
          </app-vote-bar>
        </div>
      }

      <!-- Swap button (mobile) -->
      <div class="swap-row-mobile">
        <button class="swap-btn" (click)="swap()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="swap-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4M4 17h12m0 0l-4-4m4 4l-4 4"/>
          </svg>
          สลับ
        </button>
      </div>

      <!-- Hex map -->
      <div class="glass-card">
        <h3 class="section-title">เปรียบเทียบฐานคะแนน</h3>
        <app-hex-map
          [miniHexes]="miniHexes"
          [miniSvgW]="miniSvgW"
          [miniSvgH]="miniSvgH"
          [candidateA]="candidateA()"
          [candidateB]="candidateB()"
          [districtH2H]="districtH2H()">
        </app-hex-map>
      </div>

      <!-- District comparison chart -->
      <div class="glass-card">
        <h3 class="section-title">เปรียบเทียบรายเขต</h3>
        <app-district-chart
          [shownDistricts]="shownDistricts()"
          [districtView]="districtView()"
          [candidateA]="candidateA()"
          [candidateB]="candidateB()"
          (districtViewChange)="districtView.set($event)">
        </app-district-chart>
      </div>

    </div>

    <!-- Right candidate panel -->
    <app-cand-panel
      class="cand-b"
      [info]="candidateBInfo()"
      [candidates]="sortedCandidates()"
      [selectedId]="selectedIdB()"
      (selectedIdChange)="selectedIdB.set($event)">
    </app-cand-panel>

  </div><!-- /compare-grid -->

  <!-- Scroll to top -->
  @if (showScrollTop()) {
    <button class="scroll-top-btn" (click)="scrollToTop()" aria-label="Scroll to top">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7" />
      </svg>
    </button>
  }

</div>
