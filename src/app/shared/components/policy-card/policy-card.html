<div class="policy-row" [class.rank-top]="rank() <= 3">

  <!-- Rank -->
  <div class="rank-col">
    @if (rank() === 1) {
      <span class="rank-medal gold">1</span>
    } @else if (rank() === 2) {
      <span class="rank-medal silver">2</span>
    } @else if (rank() === 3) {
      <span class="rank-medal bronze">3</span>
    } @else {
      <span class="rank-num">{{ rank() }}</span>
    }
  </div>

  <!-- Photo -->
  <div class="photo-col">
    <div class="photo-wrap" [style.borderColor]="candidate().color + '66'">
      @if (candidate().imageUrl) {
        <img [src]="candidate().imageUrl"
             class="photo-img"
             [attr.loading]="rank() <= 5 ? 'eager' : 'lazy'"
             [attr.fetchpriority]="rank() <= 5 ? 'high' : 'low'"
             decoding="async">
      } @else {
        <span class="photo-fallback" [style.color]="candidate().color">{{ candidate().name.charAt(0) }}</span>
      }
    </div>
  </div>

  <!-- Info -->
  <div class="info-col">
    <div class="cand-name">{{ candidate().name }}</div>
    <div class="cand-party">
      <img [src]="candidate().partyLogoUrl"
           class="party-micro"
           [attr.loading]="rank() <= 5 ? 'eager' : 'lazy'"
           [attr.fetchpriority]="rank() <= 5 ? 'high' : 'low'"
           decoding="async">
      <span>{{ candidate().party }}</span>
    </div>
  </div>

  <!-- Vote % -->
  <div class="vote-col">
    <div class="vote-pct" [style.color]="candidate().color">
      <app-count-up [value]="candidate().percentage" format="1.1-1" />%
    </div>
    <div class="vote-mil"><app-count-up [value]="candidate().votes / 1000000" format="1.2-2" />M</div>
  </div>

  <!-- Bar -->
  <div class="bar-col">
    <div class="bar-track">
      <div class="bar-fill"
           [style.width]="candidate().percentage + '%'"
           [style.backgroundColor]="candidate().color">
      </div>
    </div>
  </div>

</div>
