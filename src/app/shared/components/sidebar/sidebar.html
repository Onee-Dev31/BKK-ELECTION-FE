<nav class="flex flex-col items-center">
    <!-- Logo -->
    <div class="mb-6 cursor-pointer" (click)="navigate('/')" role="button" aria-label="หน้าหลัก">
        <img src="/Logo%20วันเลือกตั้ง%20ผู้ว่าฯ%20กทม.%2069%20Final.png"
             alt="วันเลือกตั้ง ผู้ว่าฯ กทม 69"
             class="w-12 h-auto opacity-90 hover:opacity-100 transition-opacity duration-200" />
    </div>

    <!-- Nav items -->
    <div class="flex flex-col items-center gap-1">
        @for (item of navItems; track item.id) {
        <div class="nav-item-wrapper group cursor-pointer">
            <button (click)="navigate(item.path)" [id]="'nav-' + item.id"
                style="cursor: pointer"
                class="relative w-12 h-12 flex items-center justify-center transition-all duration-200"
                [class.active-item]="isActive(item.path)"
                [class.inactive-item]="!isActive(item.path)">

                <div class="relative z-10 transition-transform duration-300 group-hover:scale-110">
                    @if (item.id === 'map') {
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
                            d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                    </svg>
                    } @else if (item.id === 'compare') {
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    } @else if (item.id === 'top5') {
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
                            d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                    </svg>
                    }
                </div>
            </button>
            <div class="sidebar-tooltip">{{ item.label }}</div>
        </div>
        }
    </div>

    <!-- Theme toggle -->
    <div class="mt-auto">
        <div class="nav-item-wrapper group cursor-pointer">
            <button (click)="themeService.toggle()" style="cursor: pointer"
                class="relative w-12 h-12 flex items-center justify-center transition-all duration-200 inactive-item">
                <div class="relative z-10 transition-transform duration-300 group-hover:scale-110">
                    @if (themeService.isDark()) {
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                    }
                </div>
            </button>
            <div class="sidebar-tooltip">{{ themeService.isDark() ? 'Light Mode' : 'Dark Mode' }}</div>
        </div>
    </div>
</nav>
