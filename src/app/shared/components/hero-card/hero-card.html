<div class="flex flex-col h-full overflow-hidden">

  <!-- Header -->
  <div class="flex items-start justify-between px-5 pt-5 pb-4">
    <div>
      <div class="text-[16px] font-black tracking-[0.25em] uppercase mb-1 hc-label">ผู้ว่าราชการ กทม.</div>
      <div class="font-black text-2xl tracking-tighter leading-none hc-title">กรุงเทพมหานคร</div>
    </div>
    <div class="text-4xl sm:text-5xl font-black leading-none tracking-tighter hc-year">2026</div>
  </div>

  <!-- Leading candidate card -->
  @if (candidates().length > 0) {
  <div class="mx-4 mb-4 rounded-2xl overflow-hidden relative hc-leading-card">
    <div class="flex items-stretch min-h-[110px]">

      <!-- Photo (left, full-height) -->
      <div class="w-[88px] flex-shrink-0 relative">
        <img [src]="candidates()[0].imageUrl"
             class="absolute inset-0 w-full h-full object-cover object-top"
             loading="eager"
             fetchpriority="high"
             decoding="async">
        <div class="absolute inset-0 hc-photo-fade"></div>
      </div>

      <!-- Info -->
      <div class="flex-1 px-4 py-3.5 flex flex-col justify-between">
        <div>
          <div class="flex items-center gap-2 mb-1.5">
            <span class="px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wide hc-leading-badge">LEADING</span>
            <span class="text-[16px] font-bold uppercase tracking-widest hc-no-label">No.{{ candidates()[0].number }}</span>
          </div>
          <div class="font-black text-[18px] leading-tight tracking-tight hc-candidate-name">{{ candidates()[0].name }}</div>
          <div class="flex items-center gap-1.5 mt-1">
            <img [src]="candidates()[0].partyLogoUrl"
                 class="w-3.5 h-3.5 object-contain opacity-60"
                 loading="eager"
                 fetchpriority="high"
                 decoding="async">
            <span class="text-[16px] font-bold uppercase tracking-widest hc-party-name">{{ candidates()[0].party }}</span>
          </div>
        </div>

        <!-- Vote percentage + bar -->
        <div class="mt-3">
          <div class="flex items-baseline gap-2 mb-1.5">
            <span class="text-2xl font-black tabular-nums leading-none"
                  [style.color]="candidates()[0].color">
              <app-count-up [value]="candidates()[0].percentage" format="1.1-1" />%
            </span>
            <span class="text-[16px] font-bold tabular-nums hc-votes-label">
              <app-count-up [value]="candidates()[0].votes / 1000000" format="1.2-2" />M votes
            </span>
          </div>
          <div class="h-1.5 w-full rounded-full overflow-hidden hc-bar-bg">
            <div class="h-full rounded-full transition-all duration-1000 ease-out"
                 [style.width]="candidates()[0].percentage + '%'"
                 [style.backgroundColor]="candidates()[0].color"
                 [style.boxShadow]="'0 0 8px ' + candidates()[0].color + '88'">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  }
